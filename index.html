<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SISREGATA</title>
  <link rel="icon" type="image/x-icon" href="images/favicon.png">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="top-auth-bar">
    <div class="auth-actions">
      <div id="authStatusText">
        <span class="badge-status badge-viewer">Modo Visitante (Somente Leitura)</span>
      </div>
      <button id="btnOpenLogin" class="btn-login">Área Admin</button>
      <button id="btnLogout" class="btn-logout" style="display: none;">Sair</button>
    </div>
  </div>

  <div class="layout-wrapper">
    <div class="admin-only admin-only-block col-equipes">
      <h2>🏆 Ranking das Equipes</h2>

      <div class="form-group admin-only">
        <input type="text" id="equipeNameInput" class="input-flex" placeholder="Nome da equipe (ex: Equipe 1)..." />
        <button class="btn-add" id="btnAddEquipe">+ Equipe</button>
      </div>

      <ul id="equipesRankingList"></ul>
    </div>

    <div class="col-baterias">
      <div class="admin-launch-section">
        <h2>⛵ Lançamento de Baterias</h2>

        <div class="bateria-header-box admin-only-block admin-only">
          <label for="regataNomeInput">Identificação da Bateria:</label>
          <input type="text" id="regataNomeInput" placeholder="Ex: Bateria 1..." style="width: 100%; margin-bottom: 8px;" />

          <label for="selectRegataCategoria">Tipo da Bateria:</label>
          <select id="selectRegataCategoria" style="width: 100%;">
            <option value="sub-26">Sub 26</option>
            <option value="misto">Misto</option>
            <option value="feminino">Feminino</option>
            <option value="senior">Sênior</option>
            <option value="veterano">Veterano</option>
          </select>
        </div>

        <ul id="regataTimesList"></ul>

        <div class="admin-only-block admin-only" style="width: 100%;">
          <button id="btnSalvarRegata" class="btn-save-bateria">💾 Salvar Resultado da Bateria</button>
          <button id="btnCancelEdit" class="btn-cancel-edit">Cancelar Edição</button>
        </div>
      </div>

      <div class="historico-container">
        <h3>📜 Histórico de Baterias</h3>
        <div id="historicoList"></div>
      </div>
    </div>
  </div>

  <div id="loginModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-top: 0;">Acesso Administrativo</h3>
      <input type="email" id="loginEmail" placeholder="E-mail admin" style="width: 100%; margin-bottom: 8px;" />
      <input type="password" id="loginPassword" placeholder="Senha" style="width: 100%; margin-bottom: 12px;" />
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="btnCloseLogin" style="background:#e5e7eb; color:#111;">Cancelar</button>
        <button id="btnLoginAction" class="btn-add">Entrar</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
